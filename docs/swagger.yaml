info:
  contact: {}
  description: API for analyzing company financials based on Alpha Vantage data.
  title: My Investment API
  version: "1.0"
paths:
  /api/v1/analysis/{symbol}:
    get:
      consumes:
      - application/json
      description: Get comprehensive fundamental analysis for a specific company.
        Data collection is automatic if not available.
      parameters:
      - description: Company Symbol
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.CompanyAnalysisResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Get detailed company analysis
      tags:
      - Analysis
  /api/v1/analysis/{symbol}/valuation:
    get:
      consumes:
      - application/json
      description: Get detailed valuation analysis with fair value estimates
      parameters:
      - description: Company Symbol
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.ValuationAnalysisResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Get valuation analysis for a company
      tags:
      - Analysis
  /api/v1/collect/{symbol}:
    post:
      consumes:
      - application/json
      description: 'Manually trigger data collection from Alpha Vantage. Note: Data
        collection is automatic in analysis endpoints.'
      parameters:
      - description: Company Symbol
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Trigger data collection for a company (Admin/Testing)
      tags:
      - Data Collection
  /api/v1/screening:
    post:
      consumes:
      - application/json
      description: Filter companies based on valuation, profitability, and financial
        health criteria
      parameters:
      - description: Screening criteria
        in: body
        name: criteria
        required: true
        schema:
          $ref: '#/definitions/services.ScreeningCriteria'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.ScreeningResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg.ErrorResponse'
      summary: Screen companies based on fundamental criteria
      tags:
      - Screening
  /api/v1/screening/templates:
    get:
      consumes:
      - application/json
      description: Get predefined screening templates for common investment strategies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.ScreeningTemplatesResponse'
      summary: Get screening templates
      tags:
      - Screening
swagger: "2.0"
